version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: pip
    directory: /ci/requirements
    schedule:
      interval: weekly
    # These are resolved scanner environments, not independent direct dependencies.
    # Routine upgrades are coordinated manually; security updates remain enabled.
    open-pull-requests-limit: 0

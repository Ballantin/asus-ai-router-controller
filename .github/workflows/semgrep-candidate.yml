name: Semgrep candidate resolution
on:
  push:
    branches: [develop/semgrep-remediation]
permissions:
  contents: read
jobs:
  resolve-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve compatible candidate in isolated environment
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/semgrep-candidate"
          mkdir -p scan-reports
          "$RUNNER_TEMP/semgrep-candidate/bin/python" -m pip install --only-binary=:all: --report scan-reports/candidate-install.json 'semgrep==1.187.0' 'protobuf>=6.33.5,<7' 'setuptools==84.2.1'
          "$RUNNER_TEMP/semgrep-candidate/bin/python" -m pip check
          "$RUNNER_TEMP/semgrep-candidate/bin/python" -m pip freeze | tee scan-reports/candidate-lock.txt
          "$RUNNER_TEMP/semgrep-candidate/bin/semgrep" --version
      - name: Execute candidate with existing strict report contract
        run: bash ci/semgrep-scan.sh "$RUNNER_TEMP/semgrep-candidate/bin/semgrep"
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-candidate
          path: scan-reports/
          if-no-files-found: error
          retention-days: 14

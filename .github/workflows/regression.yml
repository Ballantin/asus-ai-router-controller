name: Regression tests
on:
  push:
    branches: [main, 'develop/**']
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parser and shell syntax
        run: sh tests/test-config.sh
      - name: Mocked reconciliation
        run: python3 tests/test-reconcile.py
      - name: Mocked DNAT destination validation
        run: sh -n router/dnat-validate.sh && python3 tests/test-dnat-validate.py
      - name: Native DNAT conflict detection
        run: python3 tests/test-dnat-conflicts.py
      - name: Deterministic AWK parser fuzzing
        run: python3 tests/test-parser-fuzz.py
      - name: Compose security contract
        run: |
          set -o pipefail
          ROUTER_USER=ci-validation docker compose -f docker/docker-compose.yml config --format json | python3 tests/test-compose-security.py
      - name: Scanner gate negative controls
        run: python3 tests/test-security-gates.py

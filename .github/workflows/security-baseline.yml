name: Security baseline
on:
  push:
    branches: [main, 'develop/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  source-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck=0.9.0-1
          shellcheck --version
          python3 -m venv "$RUNNER_TEMP/quality"
          "$RUNNER_TEMP/quality/bin/pip" install --no-deps -r ci/requirements/quality.txt
          "$RUNNER_TEMP/quality/bin/pip" check
          "$RUNNER_TEMP/quality/bin/pip" freeze --all
      - name: ShellCheck (POSIX shell)
        run: |
          shellcheck -s sh router/*.sh tests/*.sh
          shellcheck -s bash ci/*.sh
      - name: Ruff
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/quality/bin/ruff" check tests/ ci/
      - name: Bandit
        if: success() || failure()
        run: bash ci/check-scan-report.sh bandit "$RUNNER_TEMP/quality/bin/bandit" -r tests/ ci/ -f json
      - name: Hadolint
        if: success() || failure()
        run: |
          docker pull hadolint/hadolint:v2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199
          docker image inspect --format '{{json .RepoDigests}}' hadolint/hadolint:v2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199
          bash ci/check-scan-report.sh hadolint docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges hadolint/hadolint:v2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199 hadolint --format json --failure-threshold warning - < docker/Dockerfile
      - name: Upload source reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-quality
          path: scan-reports/
          if-no-files-found: warn
          retention-days: 14
  static-security:
    permissions:
      contents: read
    outputs:
      semgrep-validated: ${{ steps.semgrep.outputs.validated }}
      router-policy-validated: ${{ steps.router-policy.outputs.validated }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install scanners
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --only-binary=:all: --no-deps -r ci/requirements/semgrep.txt
          "$RUNNER_TEMP/semgrep/bin/pip" check
          "$RUNNER_TEMP/semgrep/bin/pip" freeze --all
          "$RUNNER_TEMP/semgrep/bin/semgrep" --version
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --no-deps -r ci/requirements/zizmor.txt
          "$RUNNER_TEMP/zizmor/bin/pip" check
          "$RUNNER_TEMP/zizmor/bin/pip" freeze --all
      - name: Semgrep security audit
        id: semgrep
        run: |
          rc=0
          bash ci/semgrep-scan.sh "$RUNNER_TEMP/semgrep/bin/semgrep" || rc=$?
          if [ "$rc" = 0 ] || [ "$rc" = 10 ]; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: Router policy candidate (parallel validation)
        id: router-policy
        if: success() || failure()
        run: |
          python3 tests/test-router-policy.py "$RUNNER_TEMP/semgrep/bin/semgrep"
          rc=0
          python3 ci/router-policy.py || rc=$?
          if [ "$rc" = 0 ] || [ "$rc" = 10 ]; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: GitHub Actions audit
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --min-severity medium .github/workflows/
      - name: Upload static reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-security
          path: scan-reports/
          if-no-files-found: warn
          retention-days: 14
  publish-code-scanning:
    needs: static-security
    # Never grant a write token to a job executing PR-controlled scanner scripts.
    if: ${{ !cancelled() && needs.static-security.outputs.semgrep-validated == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-security
          path: reports
      - name: Publish validated Semgrep SARIF
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4 snapshot
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep-security
          wait-for-processing: true
      - name: Publish validated router policy SARIF
        if: needs.static-security.outputs.router-policy-validated == 'true'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4 snapshot
        with:
          sarif_file: reports/router-policy.sarif
          category: router-policy
          wait-for-processing: true
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history (redacted)
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          docker image inspect --format '{{json .RepoDigests}}' ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git --redact=100 --no-banner --exit-code 10 --log-opts=--all /repo
  container-vulnerabilities:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build scheduler image for target architecture
        run: |
          docker build --pull --platform linux/arm64 -t router-controller:scan docker/
          docker save router-controller:scan -o "$RUNNER_TEMP/router-controller.tar"
          # Public build artifact only; allow the capability-restricted scanner to read it.
          chmod 0444 "$RUNNER_TEMP/router-controller.tar"
      - name: Scan scheduler packages
        run: |
          docker pull aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          docker image inspect --format '{{json .RepoDigests}}' aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          bash ci/check-scan-report.sh trivy-image docker run --rm --cap-drop ALL --security-opt no-new-privileges -v "$RUNNER_TEMP/router-controller.tar:/scan/image.tar:ro" aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --input /scan/image.tar --format json --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 10
      - name: Scan container configuration
        if: success() || failure()
        run: bash ci/check-scan-report.sh trivy-config docker run --rm --cap-drop ALL --security-opt no-new-privileges -v "$PWD/docker:/scan:ro" aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c config --format json --exit-code 10 /scan
      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-vulnerabilities
          path: scan-reports/
          if-no-files-found: warn
          retention-days: 14

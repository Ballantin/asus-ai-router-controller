rules:
  - id: router-no-eval
    languages: [generic]
    paths:
      include:
        - router/*.sh
    message: Do not introduce shell eval into privileged router code.
    severity: ERROR
    pattern-regex: '(?m)^[ \t]*(?:[^#\n;]*[;|][ \t]*)?eval(?:[ \t]|$)'
  - id: router-no-global-conntrack-flush
    languages: [generic]
    paths:
      include:
        - router/*.sh
    message: Global conntrack flush violates the controller safety contract.
    severity: ERROR
    pattern-regex: '(?m)^[ \t]*(?!#)[^\n]*\bconntrack[ \t]+(?:-F|--flush)(?:[ \t]|$)'
  - id: router-no-unscoped-firewall-flush
    languages: [generic]
    paths:
      include:
        - router/*.sh
    message: Unscoped iptables flush violates the controller safety contract.
    severity: ERROR
    pattern-regex: '(?m)^[ \t]*(?!#)[^\n]*\biptables[ \t]+(?:-t[ \t]+[a-z]+[ \t]+)?(?:-F|--flush)[ \t]*(?:$|[;|])'
